apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vault-wrap-proxy.fullname" . }}
  labels:
    {{- include "vault-wrap-proxy.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "vault-wrap-proxy.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "vault-wrap-proxy.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "vault-wrap-proxy.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- if .Values.image.digest }}
          image: "{{ .Values.image.repository }}@{{ .Values.image.digest }}"
          {{- else }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          {{- end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: APP_LANGUAGE
              value: {{ .Values.app.language | quote }}
            - name: VAULT_ADDR
              value: {{ .Values.vault.address | quote }}
            - name: VAULT_ROLE
              value: {{ .Values.vault.role | quote }}
            - name: VAULT_AUTH_MOUNT
              value: {{ .Values.vault.authMount | quote }}
            {{- if .Values.vault.namespace }}
            - name: VAULT_NAMESPACE
              value: {{ .Values.vault.namespace | quote }}
            {{- end }}
            - name: DEFAULT_WRAP_TTL
              value: {{ .Values.vault.defaultTtl | quote }}
            - name: MAX_WRAP_TTL
              value: {{ .Values.vault.maxTtl | quote }}
            - name: MAX_REQUEST_SIZE
              value: {{ .Values.vault.maxRequestSize | quote }}
            - name: VAULT_TIMEOUT
              value: {{ .Values.vault.timeout | quote }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
