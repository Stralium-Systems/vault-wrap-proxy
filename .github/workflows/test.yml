name: Tests

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-tests:
    name: Python 3.15 tests and dependency audit
    runs-on: ubuntu-latest
    services:
      vault:
        image: hashicorp/vault:2.2.2@sha256:dfa48c2fa2b0099ccb47681ec5c4804bf5aec9d6879ecfee07ad4b92a5427ad6
        ports:
          - 8200:8200
        env:
          VAULT_DEV_ROOT_TOKEN_ID: root
          VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
        options: --cap-add=IPC_LOCK
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Wait for Vault
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:8200/v1/sys/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "Vault did not start in time"
          exit 1
      - name: Unit, regression and real Vault tests
        env:
          VAULT_ADDR: http://localhost:8200
          VAULT_TOKEN: root
        run: pytest tests/ -v --tb=short
      - name: Check formatting and lint
        run: |
          black --check app/ tests/ scripts/
          ruff check app/ tests/ scripts/
      - name: Audit locked Python dependencies
        run: pip-audit --strict --disable-pip --no-deps -r requirements-dev.txt

  ui-tests:
    name: Node 26 UI tests and dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm audit --audit-level=low

  infrastructure:
    name: Terraform and Helm validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned CLIs
        run: |
          bash scripts/install_infra_tools.sh "$RUNNER_TEMP/infra-tools"
          echo "$RUNNER_TEMP/infra-tools" >> "$GITHUB_PATH"
      - run: terraform -chdir=terraform fmt -check
      - run: terraform -chdir=terraform init -backend=false -input=false -lockfile=readonly
      - run: terraform -chdir=terraform validate
      - run: helm lint --strict helm/vault-wrap-proxy
      - name: Render tag and digest image references
        run: |
          helm template vault-wrap-proxy helm/vault-wrap-proxy > "$RUNNER_TEMP/chart.yaml"
          grep -F 'image: "vault-wrap-proxy:1.0.0"' "$RUNNER_TEMP/chart.yaml"
          helm template vault-wrap-proxy helm/vault-wrap-proxy \
            --set image.digest=sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef \
            > "$RUNNER_TEMP/chart-digest.yaml"
          grep -F 'image: "vault-wrap-proxy@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"' "$RUNNER_TEMP/chart-digest.yaml"
      - name: Validate language configuration
        run: |
          for language in en fr es; do
            helm template vault-wrap-proxy helm/vault-wrap-proxy \
              --set "app.language=$language" > "$RUNNER_TEMP/chart-language.yaml"
            grep -F -A1 'name: APP_LANGUAGE' "$RUNNER_TEMP/chart-language.yaml" \
              | grep -F "value: \"$language\""
          done
          if helm template vault-wrap-proxy helm/vault-wrap-proxy --set app.language=de; then
            echo 'Unsupported language was accepted'
            exit 1
          fi

  container:
    name: Build, run and scan Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify local deployment files stay outside the build context
        run: |
          trap 'rm -f .env deployment.local.yaml build-context-test.crt; rm -rf .local' EXIT
          mkdir -p .local
          printf '%s\n' 'FICTITIOUS_SETTING=example-only' > .env
          printf '%s\n' 'example: fictitious-only' > deployment.local.yaml
          printf '%s\n' 'example: fictitious-only' > .local/values.yaml
          printf '%s\n' 'fictitious-certificate-marker' > build-context-test.crt
          printf 'FROM scratch\nCOPY . /\n' > "$RUNNER_TEMP/context.Dockerfile"
          context_dir="$(mktemp -d "$RUNNER_TEMP/build-context.XXXXXX")"
          docker build --file "$RUNNER_TEMP/context.Dockerfile" \
            --output "type=local,dest=$context_dir" .
          test -f "$context_dir/app/main.py"
          test -f "$context_dir/app/static/index.html"
          test -f "$context_dir/requirements.txt"
          test ! -e "$context_dir/.env"
          test ! -e "$context_dir/.local"
          test ! -e "$context_dir/deployment.local.yaml"
          test ! -e "$context_dir/build-context-test.crt"
      - name: Build and start disposable stack
        run: docker compose up --build --detach --wait --wait-timeout 120
      - name: Test real HTTP sharing and one-time consumption
        run: python3 scripts/smoke_test.py
      - name: Test French and Spanish container configuration
        run: |
          for language in fr es; do
            APP_LANGUAGE="$language" docker compose up --detach --wait --no-build --wait-timeout 120 proxy
            EXPECTED_LANGUAGE="$language" python3 scripts/smoke_test.py
          done
      - name: Build dependencies with an optional CA bundle
        run: |
          docker build --target dependencies --no-cache \
            --secret id=build_ca,src=/etc/ssl/certs/ca-certificates.crt \
            --tag vault-wrap-proxy-build-ca-test .
      - name: Scan application image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          image-ref: vault-wrap-proxy:1.0.0
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Stop disposable stack
        if: always()
        run: docker compose down --volumes
